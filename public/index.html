<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roster — Influencer Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F2EC; --paper-raised:#FFFFFF; --ink:#1B1F2A; --ink-soft:#565C6E; --ink-faint:#8B8F9C;
    --line:#DCD6C7; --accent:#A6742C; --accent-soft:#EFE3CB;
    --risk-low:#3F6E52; --risk-low-bg:#E4EEE7; --risk-med:#A6742C; --risk-med-bg:#F3E7CF;
    --risk-high:#A5423A; --risk-high-bg:#F3E0DD;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Inter',system-ui,sans-serif; font-size:14px; line-height:1.5;}
  h1,h2,h3,.serif{font-family:'Source Serif 4',Georgia,serif;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-variant-numeric:tabular-nums;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:14px;}

  .shell{display:grid; grid-template-columns:260px 1fr; min-height:100vh;}
  .rail{border-right:1px solid var(--line); padding:28px 22px; display:flex; flex-direction:column; gap:26px; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .brand{display:flex; flex-direction:column; gap:2px;}
  .brand .mark{font-size:22px; font-weight:600; letter-spacing:-0.01em;}
  .brand .sub{color:var(--ink-faint); font-size:12px;}
  .field-group{display:flex; flex-direction:column; gap:8px;}
  .field-group label{font-size:12px; color:var(--ink-soft); font-weight:500;}
  .field-group select, .field-group input{border:1px solid var(--line); background:var(--paper-raised); border-radius:4px; padding:8px 10px; color:var(--ink);}
  .field-group select:focus, .field-group input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .rail-stats{border-top:1px solid var(--line); padding-top:16px; display:flex; flex-direction:column; gap:6px;}
  .rail-stats .row{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft);}
  .rail-stats .row b{color:var(--ink); font-weight:600;}
  .rail-footer{margin-top:auto; font-size:11px; color:var(--ink-faint); border-top:1px solid var(--line); padding-top:14px;}

  main{padding:28px 34px 60px;}
  .topbar{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:22px; flex-wrap:wrap;}
  .topbar h1{margin:0; font-size:26px; font-weight:600;}
  .topbar .count{color:var(--ink-faint); font-size:13px; margin-top:4px;}
  .actions{display:flex; gap:8px; flex-wrap:wrap;}
  .btn{border:1px solid var(--line); background:var(--paper-raised); color:var(--ink); padding:9px 14px; border-radius:4px; font-size:13px; font-weight:500; transition:border-color .12s ease;}
  .btn:hover{border-color:var(--ink-faint);}
  .btn-accent{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .btn-accent:hover{background:#2b3140;}
  .btn-danger{color:var(--risk-high);}
  .btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .search{width:100%; max-width:420px; padding:9px 12px; border:1px solid var(--line); border-radius:4px; background:var(--paper-raised); margin-bottom:18px;}
  .search:focus{outline:2px solid var(--accent); outline-offset:1px;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:14px;}
  .card{background:var(--paper-raised); border:1px solid var(--line); border-radius:6px; padding:18px; display:flex; flex-direction:column; gap:12px; cursor:pointer; transition:border-color .12s ease;}
  .card:hover{border-color:var(--accent);}
  .card:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .card-head{display:flex; align-items:center; gap:12px;}
  .avatar{width:44px; height:44px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:15px; flex-shrink:0; font-family:'Source Serif 4',serif;}
  .card-head .names{min-width:0;}
  .card-head .name{font-family:'Source Serif 4',serif; font-size:17px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card-head .loc{font-size:12px; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .niche-tags{display:flex; gap:6px; flex-wrap:wrap;}
  .tag{background:var(--accent-soft); color:var(--accent); font-size:11px; padding:3px 8px; border-radius:20px; font-weight:500;}
  .card-stats{display:flex; justify-content:space-between; border-top:1px solid var(--line); padding-top:10px;}
  .stat{display:flex; flex-direction:column; gap:2px;}
  .stat .v{font-weight:600; font-size:14px;}
  .stat .l{font-size:10.5px; color:var(--ink-faint);}
  .risk-badge{align-self:flex-start; font-size:11px; padding:3px 9px; border-radius:20px; font-weight:600;}
  .risk-low{background:var(--risk-low-bg); color:var(--risk-low);}
  .risk-med{background:var(--risk-med-bg); color:var(--risk-med);}
  .risk-high{background:var(--risk-high-bg); color:var(--risk-high);}
  .empty{border:1px dashed var(--line); border-radius:8px; padding:60px 20px; text-align:center; color:var(--ink-faint);}
  .empty h3{color:var(--ink); margin:0 0 6px;}

  .overlay{position:fixed; inset:0; background:rgba(27,31,42,0.35); display:none; z-index:40;}
  .overlay.open{display:block;}
  .panel{position:fixed; top:0; right:0; height:100vh; width:min(520px,100vw); background:var(--paper-raised); border-left:1px solid var(--line); transform:translateX(100%); transition:transform .18s ease; z-index:41; display:flex; flex-direction:column;}
  .panel.open{transform:translateX(0);}
  .panel-head{display:flex; justify-content:space-between; align-items:center; padding:20px 24px; border-bottom:1px solid var(--line);}
  .panel-head h2{margin:0; font-size:19px;}
  .panel-body{padding:22px 24px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:18px;}
  .panel-foot{padding:16px 24px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:space-between;}
  .close-x{background:none; border:none; font-size:20px; color:var(--ink-faint); line-height:1; padding:4px;}
  .close-x:hover{color:var(--ink);}
  .fieldset{display:flex; flex-direction:column; gap:6px;}
  .fieldset label{font-size:12px; font-weight:600; color:var(--ink-soft);}
  .fieldset input, .fieldset select, .fieldset textarea{border:1px solid var(--line); border-radius:4px; padding:8px 10px; width:100%; background:var(--paper);}
  .fieldset textarea{resize:vertical; min-height:56px;}
  .fieldset input:focus, .fieldset select:focus, .fieldset textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .fset-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .section-label{font-size:11px; color:var(--accent); font-weight:600; border-bottom:1px solid var(--line); padding-bottom:6px; margin-top:4px;}
  .platform-row{border:1px solid var(--line); border-radius:6px; padding:12px; display:flex; flex-direction:column; gap:10px; position:relative;}
  .platform-row .fset-row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .remove-row{position:absolute; top:8px; right:8px; background:none; border:none; color:var(--ink-faint); font-size:16px;}
  .remove-row:hover{color:var(--risk-high);}
  .add-row-btn{align-self:flex-start; font-size:12.5px; color:var(--accent); background:none; border:1px dashed var(--accent); border-radius:4px; padding:6px 10px;}

  #mediakit{display:none;}
  @media print{
    body *{visibility:hidden;}
    #mediakit, #mediakit *{visibility:visible;}
    #mediakit{display:block; position:absolute; top:0; left:0; width:100%; padding:40px;}
  }
  .mk-head{display:flex; gap:20px; align-items:center; border-bottom:2px solid var(--ink); padding-bottom:18px; margin-bottom:20px;}
  .mk-avatar{width:72px; height:72px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:600; font-family:'Source Serif 4',serif;}
  .mk-name{font-family:'Source Serif 4',serif; font-size:28px; font-weight:700; margin:0;}
  .mk-meta{color:var(--ink-soft); font-size:13px; margin-top:4px;}
  .mk-section{margin-bottom:18px;}
  .mk-section h3{font-family:'Source Serif 4',serif; font-size:14px; border-bottom:1px solid var(--line); padding-bottom:6px; margin-bottom:10px;}
  .mk-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  .mk-stat .v{font-size:18px; font-weight:700;}
  .mk-stat .l{font-size:11px; color:var(--ink-faint);}

  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:5px; font-size:13px; z-index:60; opacity:0; pointer-events:none; transition:opacity .2s ease;}
  .toast.show{opacity:1;}
  .hidden-input{display:none;}
  ::selection{background:var(--accent-soft);}
  @media (max-width:820px){
    .shell{grid-template-columns:1fr;}
    .rail{position:relative; height:auto; flex-direction:row; flex-wrap:wrap; align-items:flex-end;}
    .rail-footer{display:none;}
    main{padding:20px;}
    .panel{width:100vw;}
  }
</style>
</head>
<body>

<div class="shell">
  <aside class="rail">
    <div class="brand">
      <div class="mark">Roster</div>
      <div class="sub">Creator &amp; influencer database</div>
    </div>
    <div class="field-group"><label for="f-niche">Niche</label><select id="f-niche"><option value="">All niches</option></select></div>
    <div class="field-group"><label for="f-platform">Platform</label><select id="f-platform"><option value="">All platforms</option></select></div>
    <div class="field-group"><label for="f-minfollow">Min. followers (any platform)</label><input id="f-minfollow" type="number" min="0" placeholder="e.g. 10000"></div>
    <div class="field-group"><label for="f-minER">Min. engagement rate %</label><input id="f-minER" type="number" min="0" step="0.1" placeholder="e.g. 2.5"></div>
    <div class="field-group"><label for="f-risk">Brand safety</label>
      <select id="f-risk"><option value="">Any risk level</option><option value="low">Low risk</option><option value="medium">Medium risk</option><option value="high">High risk</option></select>
    </div>
    <button class="btn" id="clear-filters" style="align-self:flex-start;">Clear filters</button>
    <div class="rail-stats" id="rail-stats"></div>
    <div class="rail-footer">Backed by a real database on the server — every save is a network call, not local storage.</div>
  </aside>

  <main>
    <div class="topbar">
      <div><h1>Creator roster</h1><div class="count" id="roster-count">Loading…</div></div>
      <div class="actions">
        <button class="btn" id="btn-template">Download CSV template</button>
        <button class="btn" id="btn-import">Import CSV</button>
        <button class="btn" id="btn-export">Export CSV</button>
        <button class="btn btn-accent" id="btn-add">Add creator</button>
      </div>
      <input type="file" id="csv-input" class="hidden-input" accept=".csv">
    </div>
    <input type="search" class="search" id="search" placeholder="Search by name, handle, or niche…">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty-state" style="display:none;">
      <h3>No creators yet</h3><div>Add your first creator, or import a CSV to get started.</div>
    </div>
  </main>
</div>

<div class="overlay" id="overlay"></div>
<div class="panel" id="panel">
  <div class="panel-head"><h2 id="panel-title">Add creator</h2><button class="close-x" id="panel-close">×</button></div>
  <div class="panel-body" id="panel-body"></div>
  <div class="panel-foot">
    <button class="btn btn-danger" id="btn-delete" style="display:none;">Delete creator</button>
    <div style="display:flex; gap:8px; margin-left:auto;">
      <button class="btn" id="btn-mediakit" style="display:none;">Export media kit</button>
      <button class="btn btn-accent" id="btn-save">Save creator</button>
    </div>
  </div>
</div>

<div id="mediakit"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  const PLATFORMS = ["Instagram","TikTok","YouTube","X/Twitter","Twitch","LinkedIn","Pinterest","Threads","Snapchat","Facebook"];
  const API = ''; // same origin

  function emptyCreator(){
    return { id:"", name:"", stageName:"", avatarUrl:"", country:"", city:"", language:"",
      niches:[], contentFormat:"", platforms:[], contactEmail:"", contactPhone:"",
      agencyName:"", agencyEmail:"", riskLevel:"low", riskNotes:"", blacklistedTopics:"",
      paymentMethod:"", currency:"", paymentTerms:"", avgCTR:"", roas:"", generalNotes:"" };
  }

  let creators = [];
  let activeId = null;

  async function api(path, opts){
    const res = await fetch(API + path, opts);
    if(!res.ok){ throw new Error('Request failed: ' + res.status); }
    const ct = res.headers.get('content-type') || '';
    return ct.includes('application/json') ? res.json() : res.text();
  }

  async function loadCreators(){
    try{
      creators = await api('/api/creators');
    }catch(e){
      creators = [];
      toast("Couldn't reach the server. Is it running?");
    }
    renderAll();
  }

  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2400);
  }
  function fmtNum(n){
    n = Number(n)||0;
    if(n >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/,'') + 'M';
    if(n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'K';
    return String(n);
  }
  function initials(c){
    const src = (c.name || c.stageName || "?").trim();
    const parts = src.split(/\s+/).filter(Boolean);
    if(parts.length === 0) return "?";
    if(parts.length === 1) return parts[0][0].toUpperCase();
    return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
  }
  function totalFollowers(c){ return (c.platforms||[]).reduce((s,p)=> s + (Number(p.followers)||0), 0); }
  function avgER(c){
    const vals = (c.platforms||[]).map(p=>Number(p.engagementRate)).filter(v=>!isNaN(v) && v>0);
    if(vals.length===0) return null;
    return (vals.reduce((a,b)=>a+b,0)/vals.length);
  }
  function riskLabel(r){ return r==='high' ? 'High risk' : r==='medium' ? 'Medium risk' : 'Low risk'; }
  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  function refreshFilterOptions(){
    const nicheSel = document.getElementById('f-niche');
    const platSel = document.getElementById('f-platform');
    const currentNiche = nicheSel.value, currentPlat = platSel.value;
    const nicheSet = new Set();
    creators.forEach(c => (c.niches||[]).forEach(n => nicheSet.add(n)));
    nicheSel.innerHTML = '<option value="">All niches</option>' +
      [...nicheSet].sort().map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
    nicheSel.value = currentNiche;
    platSel.innerHTML = '<option value="">All platforms</option>' + PLATFORMS.map(p=>`<option>${p}</option>`).join('');
    platSel.value = currentPlat;
  }

  function getFiltered(){
    const q = document.getElementById('search').value.trim().toLowerCase();
    const niche = document.getElementById('f-niche').value;
    const platform = document.getElementById('f-platform').value;
    const minFollow = Number(document.getElementById('f-minfollow').value) || 0;
    const minER = Number(document.getElementById('f-minER').value) || 0;
    const risk = document.getElementById('f-risk').value;

    return creators.filter(c=>{
      if(q){
        const hay = [c.name,c.stageName,...(c.niches||[]), ...(c.platforms||[]).map(p=>p.handle)].join(' ').toLowerCase();
        if(!hay.includes(q)) return false;
      }
      if(niche && !(c.niches||[]).includes(niche)) return false;
      if(platform && !(c.platforms||[]).some(p=>p.platform===platform)) return false;
      if(minFollow){
        const maxF = Math.max(0, ...(c.platforms||[]).map(p=>Number(p.followers)||0));
        if(maxF < minFollow) return false;
      }
      if(minER){ const er = avgER(c); if(er === null || er < minER) return false; }
      if(risk && c.riskLevel !== risk) return false;
      return true;
    });
  }

  function renderAll(){
    refreshFilterOptions();
    const list = getFiltered();
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty-state');

    document.getElementById('roster-count').textContent =
      creators.length === 0 ? 'No creators yet' : `${list.length} of ${creators.length} creator${creators.length===1?'':'s'} shown`;

    if(list.length === 0){
      grid.innerHTML = '';
      empty.style.display = 'block';
      empty.querySelector('h3').textContent = creators.length===0 ? 'No creators yet' : 'No matches';
      empty.querySelector('div').textContent = creators.length===0
        ? 'Add your first creator, or import a CSV to get started.'
        : 'Try adjusting or clearing your filters.';
    }else{
      empty.style.display = 'none';
      grid.innerHTML = list.map(c=>{
        const niches = (c.niches||[]).slice(0,3).map(n=>`<span class="tag">${escapeHtml(n)}</span>`).join('');
        const er = avgER(c);
        return `
        <div class="card" tabindex="0" data-id="${c.id}">
          <div class="card-head">
            <div class="avatar">${initials(c)}</div>
            <div class="names">
              <div class="name">${escapeHtml(c.stageName || c.name || 'Untitled')}</div>
              <div class="loc">${escapeHtml([c.city,c.country].filter(Boolean).join(', ') || '—')}</div>
            </div>
          </div>
          ${niches ? `<div class="niche-tags">${niches}</div>` : ''}
          <div class="risk-badge risk-${c.riskLevel||'low'}">${riskLabel(c.riskLevel)}</div>
          <div class="card-stats">
            <div class="stat"><span class="v mono">${fmtNum(totalFollowers(c))}</span><span class="l">Total reach</span></div>
            <div class="stat"><span class="v mono">${er!==null ? er.toFixed(1)+'%' : '—'}</span><span class="l">Avg. ER</span></div>
            <div class="stat"><span class="v mono">${(c.platforms||[]).length}</span><span class="l">Platforms</span></div>
          </div>
        </div>`;
      }).join('');
      grid.querySelectorAll('.card').forEach(el=>{
        el.addEventListener('click', ()=> openEditor(el.dataset.id));
        el.addEventListener('keydown', e=>{ if(e.key==='Enter') openEditor(el.dataset.id); });
      });
    }
    renderRailStats();
  }

  async function renderRailStats(){
    const box = document.getElementById('rail-stats');
    if(creators.length === 0){ box.innerHTML=''; return; }
    try{
      const s = await api('/api/stats');
      box.innerHTML = `
        <div class="row"><span>Roster size</span><b>${s.count}</b></div>
        <div class="row"><span>Combined reach</span><b>${fmtNum(s.totalReach)}</b></div>
        <div class="row"><span>Avg. engagement</span><b>${s.avgEr!==null?s.avgEr.toFixed(1)+'%':'—'}</b></div>
        <div class="row"><span>High-risk flags</span><b>${s.highRisk}</b></div>
      `;
    }catch(e){ box.innerHTML=''; }
  }

  function openEditor(id){
    activeId = id || null;
    const c = id ? creators.find(x=>x.id===id) : emptyCreator();
    document.getElementById('panel-title').textContent = id ? (c.stageName || c.name || 'Edit creator') : 'Add creator';
    document.getElementById('btn-delete').style.display = id ? 'inline-block' : 'none';
    document.getElementById('btn-mediakit').style.display = id ? 'inline-block' : 'none';
    document.getElementById('panel-body').innerHTML = editorTemplate(c);
    bindPlatformRows(c.platforms && c.platforms.length ? c.platforms : []);
    document.getElementById('overlay').classList.add('open');
    document.getElementById('panel').classList.add('open');
  }
  function closeEditor(){
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('panel').classList.remove('open');
    activeId = null;
  }

  function editorTemplate(c){
    return `
      <div class="section-label">Identity</div>
      <div class="fset-row">
        <div class="fieldset"><label>Full name</label><input id="in-name" value="${escapeHtml(c.name)}"></div>
        <div class="fieldset"><label>Stage name / alias</label><input id="in-stageName" value="${escapeHtml(c.stageName)}"></div>
      </div>
      <div class="fset-row">
        <div class="fieldset"><label>Country</label><input id="in-country" value="${escapeHtml(c.country)}"></div>
        <div class="fieldset"><label>City</label><input id="in-city" value="${escapeHtml(c.city)}"></div>
      </div>
      <div class="fset-row">
        <div class="fieldset"><label>Primary language</label><input id="in-language" value="${escapeHtml(c.language)}"></div>
        <div class="fieldset"><label>Content format focus</label><input id="in-contentFormat" placeholder="Reels, long-form…" value="${escapeHtml(c.contentFormat)}"></div>
      </div>
      <div class="fieldset"><label>Niches (comma separated)</label><input id="in-niches" placeholder="Beauty, Skincare" value="${escapeHtml((c.niches||[]).join(', '))}"></div>
      <div class="fieldset"><label>Avatar image URL (optional)</label><input id="in-avatarUrl" value="${escapeHtml(c.avatarUrl)}"></div>

      <div class="section-label">Platforms &amp; performance</div>
      <div id="platform-rows" style="display:flex; flex-direction:column; gap:10px;"></div>
      <button type="button" class="add-row-btn" id="add-platform-row">+ Add platform</button>

      <div class="section-label">Contact &amp; management</div>
      <div class="fset-row">
        <div class="fieldset"><label>Business email</label><input id="in-contactEmail" value="${escapeHtml(c.contactEmail)}"></div>
        <div class="fieldset"><label>Phone / WhatsApp</label><input id="in-contactPhone" value="${escapeHtml(c.contactPhone)}"></div>
      </div>
      <div class="fset-row">
        <div class="fieldset"><label>Agency / manager</label><input id="in-agencyName" value="${escapeHtml(c.agencyName)}"></div>
        <div class="fieldset"><label>Agency booking email</label><input id="in-agencyEmail" value="${escapeHtml(c.agencyEmail)}"></div>
      </div>

      <div class="section-label">Brand safety</div>
      <div class="fset-row">
        <div class="fieldset"><label>Risk level</label>
          <select id="in-riskLevel">
            <option value="low" ${c.riskLevel==='low'?'selected':''}>Low</option>
            <option value="medium" ${c.riskLevel==='medium'?'selected':''}>Medium</option>
            <option value="high" ${c.riskLevel==='high'?'selected':''}>High</option>
          </select>
        </div>
        <div class="fieldset"><label>Blacklisted topics</label><input id="in-blacklistedTopics" placeholder="Alcohol, politics…" value="${escapeHtml(c.blacklistedTopics)}"></div>
      </div>
      <div class="fieldset"><label>Controversy / risk notes</label><textarea id="in-riskNotes">${escapeHtml(c.riskNotes)}</textarea></div>

      <div class="section-label">Commercials</div>
      <div class="fset-row">
        <div class="fieldset"><label>Payment method</label><input id="in-paymentMethod" placeholder="Bank wire, PayPal…" value="${escapeHtml(c.paymentMethod)}"></div>
        <div class="fieldset"><label>Currency</label><input id="in-currency" placeholder="USD, INR…" value="${escapeHtml(c.currency)}"></div>
      </div>
      <div class="fset-row">
        <div class="fieldset"><label>Payment terms</label><input id="in-paymentTerms" placeholder="Net-30…" value="${escapeHtml(c.paymentTerms)}"></div>
        <div class="fieldset"><label>Historical avg. CTR %</label><input id="in-avgCTR" type="number" step="0.1" value="${escapeHtml(c.avgCTR)}"></div>
      </div>
      <div class="fieldset"><label>Historical ROAS multiplier</label><input id="in-roas" type="number" step="0.1" value="${escapeHtml(c.roas)}"></div>

      <div class="section-label">Notes</div>
      <div class="fieldset"><label>General notes / past collaborations</label><textarea id="in-generalNotes">${escapeHtml(c.generalNotes)}</textarea></div>
    `;
  }

  function platformRowTemplate(p, idx){
    p = p || {};
    return `
    <div class="platform-row" data-idx="${idx}">
      <button type="button" class="remove-row" data-remove="${idx}" title="Remove platform">×</button>
      <div class="fset-row">
        <div class="fieldset"><label>Platform</label>
          <select class="p-platform">${PLATFORMS.map(pl=>`<option ${p.platform===pl?'selected':''}>${pl}</option>`).join('')}</select>
        </div>
        <div class="fieldset"><label>Handle</label><input class="p-handle" value="${escapeHtml(p.handle||'')}"></div>
      </div>
      <div class="fset-row3">
        <div class="fieldset"><label>Followers</label><input class="p-followers" type="number" min="0" value="${escapeHtml(p.followers||'')}"></div>
        <div class="fieldset"><label>Engagement %</label><input class="p-er" type="number" min="0" step="0.1" value="${escapeHtml(p.engagementRate||'')}"></div>
        <div class="fieldset"><label>Avg. views</label><input class="p-views" type="number" min="0" value="${escapeHtml(p.avgViews||'')}"></div>
      </div>
      <div class="fieldset"><label>Rate card (per post, local currency)</label><input class="p-rate" type="number" min="0" value="${escapeHtml(p.rate||'')}"></div>
    </div>`;
  }

  let platformRowsState = [];
  function bindPlatformRows(initial){
    platformRowsState = initial.length ? JSON.parse(JSON.stringify(initial)) : [{}];
    renderPlatformRows();
    document.getElementById('add-platform-row').addEventListener('click', ()=>{
      collectPlatformRowsFromDOM();
      platformRowsState.push({});
      renderPlatformRows();
    });
  }
  function renderPlatformRows(){
    const container = document.getElementById('platform-rows');
    container.innerHTML = platformRowsState.map((p,i)=>platformRowTemplate(p,i)).join('');
    container.querySelectorAll('[data-remove]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        collectPlatformRowsFromDOM();
        const idx = Number(btn.dataset.remove);
        platformRowsState.splice(idx,1);
        renderPlatformRows();
      });
    });
  }
  function collectPlatformRowsFromDOM(){
    const rows = document.querySelectorAll('#platform-rows .platform-row');
    platformRowsState = [...rows].map(row=>({
      platform: row.querySelector('.p-platform').value,
      handle: row.querySelector('.p-handle').value,
      followers: row.querySelector('.p-followers').value,
      engagementRate: row.querySelector('.p-er').value,
      avgViews: row.querySelector('.p-views').value,
      rate: row.querySelector('.p-rate').value,
    }));
  }

  function collectFromForm(){
    collectPlatformRowsFromDOM();
    const v = id => document.getElementById(id).value.trim();
    const niches = v('in-niches').split(',').map(s=>s.trim()).filter(Boolean);
    const platforms = platformRowsState
      .filter(p => p.platform && (p.handle || p.followers))
      .map(p => ({
        platform: p.platform, handle: p.handle||'',
        followers: Number(p.followers)||0, engagementRate: Number(p.engagementRate)||0,
        avgViews: Number(p.avgViews)||0, rate: Number(p.rate)||0,
      }));
    return {
      id: activeId || "",
      name: v('in-name'), stageName: v('in-stageName'), avatarUrl: v('in-avatarUrl'),
      country: v('in-country'), city: v('in-city'), language: v('in-language'),
      niches, contentFormat: v('in-contentFormat'), platforms,
      contactEmail: v('in-contactEmail'), contactPhone: v('in-contactPhone'),
      agencyName: v('in-agencyName'), agencyEmail: v('in-agencyEmail'),
      riskLevel: document.getElementById('in-riskLevel').value,
      riskNotes: v('in-riskNotes'), blacklistedTopics: v('in-blacklistedTopics'),
      paymentMethod: v('in-paymentMethod'), currency: v('in-currency'), paymentTerms: v('in-paymentTerms'),
      avgCTR: v('in-avgCTR'), roas: v('in-roas'), generalNotes: v('in-generalNotes'),
    };
  }

  async function saveCreator(){
    const data = collectFromForm();
    if(!data.name && !data.stageName){ toast("Add at least a name before saving."); return; }
    try{
      if(activeId){
        await api('/api/creators/' + activeId, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) });
      }else{
        await api('/api/creators', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) });
      }
      closeEditor();
      await loadCreators();
      toast("Creator saved.");
    }catch(e){ toast("Save failed — check the server."); }
  }

  async function deleteCreator(){
    if(!activeId) return;
    if(!confirm("Delete this creator? This can't be undone.")) return;
    try{
      await api('/api/creators/' + activeId, { method:'DELETE' });
      closeEditor();
      await loadCreators();
      toast("Creator deleted.");
    }catch(e){ toast("Delete failed — check the server."); }
  }

  function openMediaKit(){
    if(!activeId) return;
    const c = collectFromForm();
    const er = avgER(c);
    const platformRows = (c.platforms||[]).map(p=>`
      <div class="mk-stat"><div class="v mono">${fmtNum(p.followers)}</div><div class="l">${escapeHtml(p.platform)} · ${escapeHtml(p.handle||'—')} · ${p.engagementRate||0}% ER</div></div>`).join('');
    document.getElementById('mediakit').innerHTML = `
      <div class="mk-head">
        <div class="mk-avatar">${initials(c)}</div>
        <div><p class="mk-name">${escapeHtml(c.stageName || c.name)}</p>
        <div class="mk-meta">${escapeHtml([c.city,c.country].filter(Boolean).join(', '))} ${c.niches&&c.niches.length ? ' · ' + escapeHtml(c.niches.join(', ')) : ''}</div></div>
      </div>
      <div class="mk-section"><h3>Reach &amp; performance</h3>
        <div class="mk-grid">
          <div class="mk-stat"><div class="v mono">${fmtNum(totalFollowers(c))}</div><div class="l">Total reach</div></div>
          <div class="mk-stat"><div class="v mono">${er!==null?er.toFixed(1)+'%':'—'}</div><div class="l">Avg. engagement</div></div>
          <div class="mk-stat"><div class="v mono">${c.avgCTR||'—'}${c.avgCTR?'%':''}</div><div class="l">Avg. CTR</div></div>
        </div>
      </div>
      <div class="mk-section"><h3>By platform</h3><div class="mk-grid">${platformRows || '<div class="mk-meta">No platforms added.</div>'}</div></div>
      <div class="mk-section"><h3>Booking</h3>
        <div class="mk-meta">
          ${c.agencyName ? `Agency: ${escapeHtml(c.agencyName)}<br>` : ''}
          ${c.agencyEmail || c.contactEmail ? `Contact: ${escapeHtml(c.agencyEmail || c.contactEmail)}<br>` : ''}
          ${c.paymentTerms ? `Terms: ${escapeHtml(c.paymentTerms)}` : ''}
        </div>
      </div>
      ${c.generalNotes ? `<div class="mk-section"><h3>Notes</h3><div class="mk-meta">${escapeHtml(c.generalNotes)}</div></div>` : ''}
    `;
    window.print();
  }

  async function handleCSVFile(file){
    const text = await file.text();
    try{
      const result = await api('/api/import', { method:'POST', headers:{'Content-Type':'text/csv'}, body: text });
      await loadCreators();
      toast(`Imported ${result.added} creator${result.added===1?'':'s'}.`);
    }catch(e){ toast("Import failed — check the server."); }
  }

  document.getElementById('btn-add').addEventListener('click', ()=>openEditor(null));
  document.getElementById('panel-close').addEventListener('click', closeEditor);
  document.getElementById('overlay').addEventListener('click', closeEditor);
  document.getElementById('btn-save').addEventListener('click', saveCreator);
  document.getElementById('btn-delete').addEventListener('click', deleteCreator);
  document.getElementById('btn-mediakit').addEventListener('click', openMediaKit);
  document.getElementById('search').addEventListener('input', renderAll);
  ['f-niche','f-platform','f-minfollow','f-minER','f-risk'].forEach(id=>{
    document.getElementById(id).addEventListener('input', renderAll);
    document.getElementById(id).addEventListener('change', renderAll);
  });
  document.getElementById('clear-filters').addEventListener('click', ()=>{
    document.getElementById('f-niche').value=''; document.getElementById('f-platform').value='';
    document.getElementById('f-minfollow').value=''; document.getElementById('f-minER').value='';
    document.getElementById('f-risk').value=''; document.getElementById('search').value='';
    renderAll();
  });
  document.getElementById('btn-template').addEventListener('click', ()=>{ window.location = '/api/csv-template'; });
  document.getElementById('btn-export').addEventListener('click', ()=>{ window.location = '/api/export'; });
  document.getElementById('btn-import').addEventListener('click', ()=>document.getElementById('csv-input').click());
  document.getElementById('csv-input').addEventListener('change', e=>{
    if(e.target.files[0]) handleCSVFile(e.target.files[0]);
    e.target.value = '';
  });
  document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeEditor(); });

  loadCreators();
})();
</script>
</body>
</html>
